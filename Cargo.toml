[package]
name = "zaxis"
version = "0.0.3"
edition = "2021"
rust-version = "1.90"
description = "An event-driven immediate mode GUI for desktop tools"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nihmadev/zaxis"
homepage = "https://nihmadev.github.io/zaxis/"
documentation = "https://docs.rs/zaxis"
keywords = ["gui", "ui", "wgpu", "desktop", "immediate-mode"]
categories = ["gui", "graphics"]
include = [
    "/src/**", "/examples/**", "/tests/**", "/benches/**", "/assets/**",
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md",
    "/CONTRIBUTING.md", "/SECURITY.md", "/RELEASING.md", "/rustfmt.toml",
]

[workspace]
members = ["crates/z-emoji", "crates/z-icons"]
resolver = "2"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
winit = "0.30.13"
wgpu = "30.0.1"
glam = "0.33.12"
ab_glyph = "0.2.32"
bytemuck = { version = "1.25.2", features = ["derive"] }
unicode-segmentation = { version = "1.13", default-features = false }
cosmic-text = "0.17.0"
unicode-script = "0.5.8"
z-emoji = { version = "0.0.1", path = "crates/z-emoji", optional = true }
z-icons = { version = "0.0.1", path = "crates/z-icons", optional = true }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
accesskit = { version = "0.25.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
accesskit_winit = { version = "0.34.1", default-features = false, features = ["rwh_06"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", features = ["webgpu", "webgl"] }
cosmic-text = { version = "0.17.0", features = ["wasm-web"] }
web-time = "1.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlCanvasElement", "HtmlElement", "Element", "Navigator",
    "ClipboardEvent", "DataTransfer", "Event", "EventTarget", "Location",
    "CssStyleDeclaration", "KeyboardEvent", "console",
] }

[features]
default = [
    "bundled-emoji", "bundled-weights", "bundled-monospace", "image-gif", "image-tiff",
    "accesskit",
]
# OS accessibility tree (UI Automation, NSAccessibility). AT-SPI on Linux and the BSDs
# needs `accesskit_unix` as well: it brings a D-Bus client and an async executor.
accesskit = ["dep:accesskit", "dep:accesskit_winit"]
accesskit_unix = ["accesskit", "accesskit_winit/accesskit_unix", "accesskit_winit/async-io"]
bundled-emoji = ["dep:z-emoji"]
bundled-weights = []
bundled-monospace = []
bundled-icons = ["dep:z-icons"]
image-gif = ["image/gif"]
image-tiff = ["image/tiff"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "=0.35.2", default-features = false, features = ["system"] }
accesskit_consumer = "0.39.1"

[[bench]]
name = "performance"
path = "benches/performance.rs"
harness = false

[[bench]]
name = "context_menu"
harness = false

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "icons"
path = "examples/icons.rs"
required-features = ["bundled-icons"]

[[example]]
name = "list_box"
path = "examples/list_box.rs"
required-features = ["bundled-icons"]

[[example]]
name = "segmented_control"
path = "examples/segmented_control.rs"
required-features = ["bundled-icons"]

[[example]]
name = "settings"
path = "examples/settings.rs"

[[example]]
name = "accessibility"
path = "examples/accessibility.rs"
required-features = ["accesskit"]

[[example]]
name = "integration"
path = "examples/integration.rs"
required-features = ["accesskit"]

[[example]]
name = "web_landing"
path = "examples/web_landing.rs"
required-features = ["bundled-icons"]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

[profile.bench]
debug = false
